name: deploy monitoring lab

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DEPLOY_PATH: /opt/apps/monitoring-lab
      

jobs:
  validate-compose:
    name : Validate docker-compose files
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Validate docker-compose files
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config -q
  
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate-compose

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      
      - name: Create deploy directory on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "mkdir -p ${DEPLOY_PATH}"

      - name: Copy deployment files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            --exclude='.env*' \
            -e "ssh -i ~/.ssh/vps_key" \
            docker-compose.yml monitoring \
            "$VPS_USER@$VPS_HOST:${DEPLOY_PATH}/"
      
      - name: Run Docker Compose deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" << EOF
            set -e

            cd ${DEPLOY_PATH}

            if [ ! -f .env ]; then
              echo "ERROR: .env file not found in ${DEPLOY_PATH}"
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            docker compose --env-file .env -f docker-compose.yml pull
            docker compose --env-file .env -f docker-compose.yml up -d --remove-orphans
            docker image prune -f

            docker logout ghcr.io || true

            docker compose --env-file .env -f docker-compose.yml ps
          EOF
        
        