[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       spring_json
    Reserve_Data On
    Preserve_Key Off

[FILTER]
    Name         modify
    Match        *
    Add          stack observability-microservices-lab

[OUTPUT]
    Name                opensearch
    Match               *
    Host                opensearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     logs-microservices
    Suppress_Type_Name  On
    Replace_Dots        On
    Trace_Error         On